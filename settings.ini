[Bots]
Enabled=1
; Size of the game's teams (1= solo, 2 = duos, 4 = squads)
TeamSize=1
; Whether bots should join player's teams
BotsInTeam=0
; 1 = register each bot with PUBG as a player (its own team) so the game counts it,
;     it rides the plane and jumps. 0 = old behaviour (not counted)
RegisterTeams=1
; 1 = JOINED / "X left" / ranks count humans + bots (the game itself only counts real logins)
BotsInPlayerCount=1
; 1 = don't let the game end the match while bots are still alive (as long as a human is alive)
KeepMatchWhileBotsAlive=1
; 1 = the lobby countdown stays at full while no real player is in the lobby (an empty server never plays
;     a match by itself); it starts counting when the first player joins
HoldLobbyWhenEmpty=1
; seconds after the last real player dies (or leaves) before the match ends - bots alone don't keep it going (0 = off)
EndWhenPlayersDead=5
; seconds after the match ends before the server closes itself (no crash box, the watchdog restarts it right away; 0 = off)
ExitAfterMatch=5

; --- plane / landing -----------------------------------------------------
; seconds after boarding the plane before a bot jumps (random between these)
EjectMin=10
EjectMax=50
; 1 = bots only jump over land and are put safely on the ground (no fall damage)
SuperheroDrop=1
; once the plane is over land, each bot jumps within this many seconds (spreads them out)
JumpSpread=30
; cm - bots land up to this far from the point under the plane (250000 = 2.5 km)
DropSpread=250000
; seconds after landing before a bot starts shooting
LandingGrace=25
; seconds you can see a bot skydiving after it jumps, before it vanishes into its simulated drop
VisibleFall=12
; seconds from jumping out of the plane to showing up on the ground (simulated skydive: the bot is placed
;     on its landing spot right away but stays invisible / untouchable until then). No gun until it's down.
DropTimeMin=45
DropTimeMax=100
; seconds after the match starts: everyone still in the plane is thrown out (0 = off)
PlaneKickTime=0
PlaneMinZ=100000
PlaneZ=150000
; how many bots to spawn
Count=50
MaxBots=90
SpawnOnMatchStart=1
; bots spawned per AI think (10/s) - keeps the server from hitching
SpawnPerTick=15

; --- what gets spawned ---------------------------------------------------
; character class for bots (auto = the class a real player's character has)
PawnClass=auto
; comma list matched against gun class names (type "weapons" in the console to see them)
; empty = random non-pistol gun.  e.g.  Weapon=AK47,M16,SCAR
Weapon=
NamePrefix=Bot_
; random spawn box (same box the server uses to teleport players)
SpawnMinX=150000
SpawnMaxX=550000
SpawnMinY=150000
SpawnMaxY=500000
; raise if bots spawn on the sea floor (check a bot's Z with VerboseLog=1)
MinSpawnZ=-1000000
; water level: empty = learned automatically the first time a bot lands in water
; (the log prints it - put that number here to skip the learning step)
SeaLevelZ=

; --- brain ---------------------------------------------------------------
ThinkHz=10
; 1 = bots far from every player think less often (600 m+: 3x/s, 1.5 km+: 1x/s) - big CPU saver with lots of bots
AiLod=1
; cm - normal sight range (30000 = 300 m)
ViewDistance=35000
; cm - sight range for ~6 s after being shot or hearing gunfire (500 m)
AlertDistance=45000
; cm - bots hear a player shooting this far away and go check it out (300 m, 0 = off)
HearingDistance=50000
; 1 = roaming bots drift toward the nearest player (more fights, less empty map)
HuntPlayers=1
; cm - only players within this range pull bots in (2 km)
HuntDistance=200000
; 0-1 - share of a HUNTER's roam picks that head toward its player
HuntChance=0.9
; share of a normal (non-hunter) bot's roam picks that drift toward a player. 0 = they stay around their own
;     area (where they landed / where the zone pushes them) so they're spread across the map
DriftChance=0
; most bots fighting one player at the same time - 1 = once a bot engages you, no other bot joins in
;     (a bot you shoot can always fight back)
MaxBotsPerPlayer=4
; how many of the closest bots come to check out a burst of gunfire
MaxResponders=4
; seconds after a bot hits you before it can hit you again (a breather to react / find cover)
HitCooldown=1.5
; seconds you stay "taken" by the bot fighting you after it last saw you - no other bot joins in meanwhile
ClaimHold=2
; cm - bot hit chance halves at this range: 4000 = 1/2 at 40 m, ~1/7 at 100 m, ~1/20 at 180 m (lower = worse at range)
HitFalloffDist=3000
; share of bots that hang out in the blue until the gas is close, then run into the zone (0-1)
LateZoneShare=0.3
; cm - how close the gas gets before those late bots start running in
LateZoneMargin=25000
; cm - hunters are picked from bots already within this range of you (they run in, no teleporting)
HunterPickRange=150000
; cm - how far a bot runs per leg when it is outside the safe zone
ZoneLeg=30000
; 1 = probe ahead while walking: go around walls, hop small obstacles, steer away from water
AvoidObstacles=1
FovDegrees=103
; seconds from first sighting to first shot
ReactionTime=0.75
FightEachOther=1
; seconds after the match starts before bots fight EACH OTHER (they still shoot players)
BotPeaceTime=600

; --- shooting ------------------------------------------------------------
; 1 = bots roll their own hits and apply damage (needed: 2017 PUBG lets the
;     shooter's CLIENT report hits, and bots have no client)
OwnHitRoll=1
; hit chance per shot at point blank, falls to 25% of this at ViewDistance
Accuracy=0.12
; hit chance when a fight has just started - bots "dial in" from this up to Accuracy
AccuracyStart=0.7
; seconds of shooting at the same target to go from AccuracyStart to Accuracy
AccuracyRampTime=15
; the first shots of every new fight always miss (you hear the shots / see tracers and dirt kick up)
WarningShots=3
; never more hits than this in one burst (no more burst-and-dead)
MaxHitsPerBurst=2
; Every burst before burst number HitBurstMin..HitBurstMax of a fight misses. In that burst (and the
; next ones if needed) the bot lands HitsPerWindowMin..HitsPerWindowMax hits, then misses again for
; WindowGapMin..WindowGapMax bursts before the next hit window. Far / moving targets can skip a window.
ScheduledHits=1
HitBurstMin=2
HitBurstMax=7
HitsPerWindowMin=2
HitsPerWindowMax=3
WindowGapMin=2
WindowGapMax=3
; cm - beyond this (100 m) bots fire short bursts with longer pauses and hit windows get rarer with distance
LongRangeDist=10000
; cm - bots this close (40 m) to each other may fight even during BotPeaceTime
; (a bot that is fighting a player can always be shot by other bots)
CloseFightDist=4000
; 1 = when a player hits a bot it gets one early hit window (instead of waiting for burst 6-7)
ReturnFire=1
; hits in that early window - after it the normal 3-5 burst gap applies again (HitCooldown still applies too)
ReturnFireHits=2
; which burst after being hit may land it (1 = the very next burst, 2 = the one after)
ReturnFireBurstMin=1
ReturnFireBurstMax=2
; seconds of dodging after a player hits it: side steps every 0.5-1 s
EvadeTime=4
; 1 = crouch spam while dodging
EvadeCrouch=1
; hit chance multiplier when the target is running or driving
MovingTargetFactor=0.5
; cm - bots only shoot at players closer than this (30000 = 300 m); further away they close in first
; (past LongRangeDist they still fire, just short bursts with long pauses)
MaxFireDistance=30000
; seconds after a player lands before bots may shoot them (bots never shoot players in the air)
PlayerLandingGrace=10
; 1 = until a bot is shot: only one bot shoots a player at a time, only out in the open, single taps (full bursts once you hit it)
FairFights=1
; 1 = log which bot spots / hits you, and why a bot near you is not fighting
CombatLog=1
Damage=5
HeadshotChance=0.2
HeadshotMultiplier=1.0
; optional UDamageType class name if the game ignores engine-default damage
DamageTypeClass=
BurstMin=0.25
BurstMax=0.8
BurstPauseMin=0.8
BurstPauseMax=2.0
InfiniteAmmo=1

; --- movement ------------------------------------------------------------
RoamRadius=12000
; bots per living player that always know where that player is and hunt them (0 = off)
HuntersPerPlayer=1
; seconds before a dead hunter is replaced (150 = 2.5 min)
HunterRefillDelay=90
; 1 = replacement hunters may also teleport near the player (0 = only the first wave does, replacements walk in)
HunterCatchUpReplacements=1
; seconds between hunters updating where the player is
HunterReplan=3
; cm - hunters aim for a spot this far from the player, each from its own side (flanking)
HunterStandoff=1500

; --- clothes / kill feed ---------------------------------------------------
; 1 = bots get random clothes (shirt, pants, shoes + sometimes jacket, hat, gloves, glasses, mask)
DressBots=1
; 1 = players get random clothes too (only in slots that are empty)
DressPlayers=1
; 1 = after dressing a bot, run the game's own appearance rebuild on it (head, hair, clothes) - fix for
;     headless / naked / red-ghost bots
BotUpdateAppearance=1
; 1 = give bots a face / hair / skin: copied from a connected player of the same gender (fix for clothes
;     with no body inside)
BotBodyFix=1
; match = only spawn bot genders a connected player has (needed for BotBodyFix) | random | female | male
BotGender=match
; experimental: also rebuild the fixed look on the server itself (leave 0 unless bots lose their heads after looting)
BodyServerRebuild=0
; old workaround: copy a real player's look onto bots (leave 0)
CopyAppearance=0
; 1 = flag bots as bots in their player state. Clients then draw them as test bots (red ghosts / headless) - keep 0
MarkAsBot=0
; 1 = lobby: bots walk circles, bunny-hop, crouch-spam, spin and sprint around instead of standing still
LobbyAntics=1
; 1 = bots get no gun in the lobby / plane - they're armed once the match starts
UnarmedInLobby=1
; 1 = lobby antics include walking up to someone and throwing punches
LobbyPunch=0
; 1 = kill feed counts players + bots, so a kill no longer says "MATCH FINISHED"
FixKillFeedCount=1
; 1 = players see and hear bot gunfire (muzzle flash, sound, tracers)
ShowBotShots=1
; 1 = a hunter that is very far from its player, or keeps walking into water, gets put on land near the player
HunterCatchUp=1
; cm - farther than this from its player = catch up (150000 = 1.5 km)
HunterCatchUpDist=60000
; cm - catch-up puts it between these distances from the player (250-450 m)
HunterCatchUpMin=15000
HunterCatchUpMax=30000
AcceptRadius=120
; head toward the white circle when outside it
FollowZone=1
Sprint=1

; --- misc ----------------------------------------------------------------
; 1 = verbose bot log (every arm/move/water step) - 0 keeps the log small
VerboseLog=0
